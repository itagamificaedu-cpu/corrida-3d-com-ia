<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Corrida 3D com IA</title>
  <link rel="stylesheet" href="estilo.css" />
</head>
<body>
  <div id="tela-jogo">
    <canvas id="canvas-jogo"></canvas>

    <div id="hud">
      <div id="hud-voltas">Volta 1/3</div>
      <div id="hud-tempo">00:00.0</div>
      <div id="hud-velocidade">0 km/h</div>
    </div>

    <div id="tela-inicio" class="sobreposicao">
      <h1>🏁 Corrida 3D com IA</h1>
      <p>Complete 3 voltas na pista o mais rápido que puder.<br />Pegue os anéis amarelos para ganhar turbo!</p>
      <button id="botao-iniciar">Começar corrida</button>
      <p class="dica-controles">
        Computador: setas ou WASD para dirigir.<br />
        Celular: use os botões na tela.
      </p>
    </div>

    <div id="tela-fim" class="sobreposicao escondido">
      <h1>🏆 Corrida concluída!</h1>
      <p id="tempo-final"></p>
      <button id="botao-reiniciar">Correr de novo</button>
    </div>

    <div id="controles-toque" class="escondido">
      <div id="controles-direcao">
        <button id="botao-esquerda" class="botao-toque">◀</button>
        <button id="botao-direita" class="botao-toque">▶</button>
      </div>
      <div id="controles-pedal">
        <button id="botao-freio" class="botao-toque">🛑</button>
        <button id="botao-acelerar" class="botao-toque">⬆</button>
      </div>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
